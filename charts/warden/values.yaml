replicaCount: 2

image:
  repository: ghcr.io/aechrok/warden
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: warden.example.com
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# Prometheus ServiceMonitor
metrics:
  enabled: false
  interval: 30s
  path: /metrics

# Environment variables — stored in a Secret named {{ .Release.Name }}-env
env:
  DATABASE_URL: ""
  ENCRYPTION_KEY: ""
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URL: ""
  SERVER_PORT: "8080"
  ON_CALL_PROVIDER: "none"
  ON_CALL_API_KEY: ""

nodeSelector: {}
tolerations: []
affinity: {}
