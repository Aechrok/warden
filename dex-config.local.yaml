# Dex config for local docker compose (make up).
# localhost:5556 is where the browser can reach Dex via Docker's port mapping.
# The warden server uses OIDC_INTERNAL_ISSUER so it dials dex:5556 internally
# while sending Host: localhost:5556, satisfying Dex's issuer check.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

staticClients:
  - id: warden
    secret: warden-secret
    redirectURIs:
      - http://localhost:8080/auth/callback
      - http://localhost:5173/auth/callback
    name: Warden Local
    skipApprovalScreen: true

enablePasswordDB: true

staticPasswords:
  - email: admin@warden.dev
    # bcrypt of "warden"
    hash: "$2y$10$H2AagIY1bivX4AkLc.0BhuHhBN9LjedjcrUil305/g0A0mKNqRTs."
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
